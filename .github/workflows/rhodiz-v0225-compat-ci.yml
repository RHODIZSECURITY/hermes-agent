name: rhodiz-v0225-compat-ci

on:
  pull_request:
    paths:
      - "agent/**"
      - "tools/**"
      - "model_tools.py"
      - "plugins/platforms/whatsapp/**"
      - "tests/gateway/test_whatsapp_*.py"
      - "tests/gateway/test_rhodiz_wwebjs_bridge_integrity.py"
      - "tests/agent/test_rhodiz_product_identity.py"
      - "tests/tools/test_skills_tool.py"
      - ".github/workflows/rhodiz-v0225-compat-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rhodiz-core-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install official pinned uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Install locked candidate dependencies and test harness
        run: |
          set -euo pipefail
          uv sync --locked --no-default-groups --python 3.14 --no-progress
          uv pip install --python .venv/bin/python 'pytest==9.1.1' 'pytest-asyncio==1.3.0'
      - name: Test against a Git-free isolated copy and synthetic profile home
        run: |
          set -euo pipefail
          test_root="$RUNNER_TEMP/rhodiz-candidate"
          test_home="$RUNNER_TEMP/rhodiz-home"
          mkdir -p "$test_root" "$test_home"
          rsync -a --exclude='.git' --exclude='.venv' --exclude='__pycache__' ./ "$test_root/"
          cd "$test_root"
          export HOME="$test_home"
          export PYTHONPATH="$test_root"
          export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          "$GITHUB_WORKSPACE/.venv/bin/python" -m compileall -q agent gateway tools hermes_cli plugins/platforms/whatsapp model_tools.py
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest -q --tb=short --maxfail=12 -p pytest_asyncio.plugin \
            tests/agent/test_rhodiz_product_identity.py \
            tests/agent/test_prompt_builder.py \
            tests/tools/test_skills_tool.py \
            tests/gateway/test_whatsapp_*.py \
            tests/gateway/test_rhodiz_wwebjs_bridge_integrity.py \
            tests/tools/test_whatsapp_send_message_media.py \
            tests/gateway/test_authenticated_session_identity.py \
            tests/gateway/test_multiplex_profile_authz.py \
            tests/plugins/memory/test_multiplex_memory_identity_scope.py

  gateway-local-synthetic-e2e:
    needs: rhodiz-core-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Install locked dependencies and test harness
        run: |
          set -euo pipefail
          uv sync --locked --no-default-groups --python 3.14 --no-progress
          uv pip install --python .venv/bin/python 'pytest==9.1.1' 'pytest-asyncio==1.3.0'
      - name: Execute local gateway process E2E with a fake LLM (no WhatsApp credentials)
        run: |
          set -euo pipefail
          test_root="$RUNNER_TEMP/rhodiz-e2e-candidate"
          test_home="$RUNNER_TEMP/rhodiz-e2e-home"
          mkdir -p "$test_root" "$test_home"
          rsync -a --exclude='.git' --exclude='.venv' --exclude='__pycache__' ./ "$test_root/"
          cd "$test_root"
          export HOME="$test_home"
          export PYTHONPATH="$test_root"
          export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest -q --tb=short --maxfail=3 -p pytest_asyncio.plugin tests/gateway/test_local_session_voice_tts.py
